name: Build, Validate and Publish Team Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: team-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: |
          dotnet build VideoBatchStudio.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Install and verify all required portable components
        shell: pwsh
        run: |
          ./Setup/Package-Release.ps1 -BuildDirectory bin_out/Release/net48 -OutputDirectory release_assets
      - name: Keep validated artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VideoBatchStudio-team-package
          path: |
            release_assets/VideoBatchStudio.exe
            release_assets/VideoBatchStudio_Portable.zip
            release_assets/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
      - name: Publish current version without changing its version number
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $metadata = Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $tag = 'v' + $metadata.version
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:RELEASE_COMMIT --title ('VideoBatchStudio ' + $metadata.version) --notes 'Complete team package with verified components and one-click model setup.' --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag release_assets/VideoBatchStudio.exe release_assets/VideoBatchStudio_Portable.zip release_assets/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $release = gh api ('repos/' + $env:GH_REPO + '/releases/tags/' + $tag) | ConvertFrom-Json
          foreach ($name in @('VideoBatchStudio.exe','VideoBatchStudio_Portable.zip','SHA256SUMS.txt')) {
            $asset = $release.assets | Where-Object name -eq $name
            $hash = (Get-FileHash -LiteralPath ('release_assets/' + $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not $asset -or $asset.digest -ne ('sha256:' + $hash)) { throw ('Published asset hash mismatch: ' + $name) }
          }
          Write-Output ('Verified release: ' + $release.html_url)
