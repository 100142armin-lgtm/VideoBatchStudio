name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build VideoBatchStudio
        shell: pwsh
        run: |
          dotnet build -c Release VideoBatchStudio.csproj
          if (-not (Test-Path "bin/Release/net48/VideoBatchStudio.exe")) {
            throw "Build output VideoBatchStudio.exe not found!"
          }

      - name: Package Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          New-Item -ItemType Directory -Force -Path staging/VideoBatchStudio | Out-Null

          # Copy compiled binary
          Copy-Item -Path "bin/Release/net48/VideoBatchStudio.exe" -Destination "release_assets/VideoBatchStudio.exe" -Force
          Copy-Item -Path "bin/Release/net48/VideoBatchStudio.exe" -Destination "staging/VideoBatchStudio/VideoBatchStudio.exe" -Force

          # Copy fonts and documentation
          Copy-Item -Path "fonts" -Destination "staging/VideoBatchStudio/fonts" -Recurse -Force
          Copy-Item -Path "完整使用说明.md" -Destination "staging/VideoBatchStudio/" -Force
          Copy-Item -Path "使用说明.txt" -Destination "staging/VideoBatchStudio/" -Force
          Copy-Item -Path "THIRD_PARTY_NOTICES.txt" -Destination "staging/VideoBatchStudio/" -Force
          Copy-Item -Path "README.md" -Destination "staging/VideoBatchStudio/" -Force

          # Copy bundled FFmpeg (pre-installed on windows-latest runner)
          $ffmpegCmd = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if ($ffmpegCmd) {
            Copy-Item -Path $ffmpegCmd.Source -Destination "staging/VideoBatchStudio/ffmpeg.exe" -Force
            Write-Host "Bundled FFmpeg from: $($ffmpegCmd.Source)"
          } else {
            Write-Host "ffmpeg.exe not found on PATH, attempting chocolatey bin..."
            if (Test-Path "C:\ProgramData\chocolatey\bin\ffmpeg.exe") {
              Copy-Item -Path "C:\ProgramData\chocolatey\bin\ffmpeg.exe" -Destination "staging/VideoBatchStudio/ffmpeg.exe" -Force
            }
          }

          # Download and bundle yt-dlp.exe
          try {
            Write-Host "Downloading yt-dlp.exe for portable bundle..."
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "staging/VideoBatchStudio/yt-dlp.exe" -TimeoutSec 60
            Write-Host "Bundled yt-dlp.exe successfully"
          } catch {
            Write-Host "yt-dlp download failed: $_"
          }

          # Download and bundle whisper CPU engine into staging/whisper
          try {
            Write-Host "Downloading whisper-bin-x64.zip for portable bundle..."
            New-Item -ItemType Directory -Force -Path "staging/VideoBatchStudio/whisper" | Out-Null
            Invoke-WebRequest -Uri "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.0/whisper-bin-x64.zip" -OutFile "whisper_temp.zip" -TimeoutSec 90
            Expand-Archive -Path "whisper_temp.zip" -DestinationPath "staging/VideoBatchStudio/whisper" -Force
            Remove-Item "whisper_temp.zip" -Force -ErrorAction SilentlyContinue
            Write-Host "Bundled whisper CPU engine successfully"
          } catch {
            Write-Host "whisper engine download failed: $_"
          }

          # Download and bundle ggml-base.bin model into staging/whisper/models
          try {
            Write-Host "Downloading ggml-base.bin for portable bundle..."
            New-Item -ItemType Directory -Force -Path "staging/VideoBatchStudio/whisper/models" | Out-Null
            Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin" -OutFile "staging/VideoBatchStudio/whisper/models/ggml-base.bin" -TimeoutSec 180
            Write-Host "Bundled ggml-base.bin model successfully"
          } catch {
            Write-Host "ggml-base.bin download failed: $_"
          }

          # Create Portable Zip
          Compress-Archive -Path "staging/VideoBatchStudio/*" -DestinationPath "release_assets/VideoBatchStudio_Portable.zip" -Force

          Write-Host "Generated release assets:"
          Get-ChildItem -Path release_assets | Select-Object Name, Length

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release_assets/*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
